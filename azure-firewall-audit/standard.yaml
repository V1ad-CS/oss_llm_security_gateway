# Стандарт конфигурации Azure Firewall и Network Security Groups (NSG).
#
# azfw_audit.py сравнивает с ним текущую конфигурацию и выводит отклонения в отчёт.
# Конфигурация в Azure при этом не меняется. Отсутствующие параметры берутся
# из значений по умолчанию (DEFAULT_STANDARD в azfw_audit.py).
#
# Значения режимов пишите в кавычках: YAML читает голое Off как false.

# Минимальный уровень SKU: "Basic" | "Standard" | "Premium" | null (не проверять).
minimum_sku_tier: "Standard"

# Требуемый режим Threat Intelligence: "Alert" | "Deny" | null.
# Для брандмауэра с политикой учитывается вся цепочка базовых политик.
threat_intel_mode: "Deny"

# Требуемый режим IDPS для Premium: "Alert" | "Deny" | null.
idps_mode: "Deny"

# Premium: требовать сертификат ЦС для TLS-инспекции в политике.
require_tls_inspection: false

# Требовать DNS proxy всегда. Если false, отсутствие DNS proxy считается
# отклонением только при FQDN в сетевых правилах.
require_dns_proxy: false

# Требовать параметр диагностики, отправляющий журналы брандмауэра.
require_diagnostic_settings: true

# Категории журналов, которые должны быть включены (если не включена группа allLogs).
# Например: [AZFWNetworkRule, AZFWApplicationRule, AZFWNatRule, AZFWThreatIntel, AZFWIdpsSignature]
required_log_categories: []

require_availability_zones: false

# Требовать описание у каждого правила.
require_rule_description: false

# Разрешающий диапазон шире этого числа портов считается отклонением.
max_port_range: 1000

# Порты, которые не должны быть открыты для любого источника
# (сетевые Allow-правила и DNAT, включая порт после трансляции).
sensitive_ports: [20, 21, 22, 23, 135, 137, 138, 139, 445, 1433, 1521, 2375, 2376,
                  3306, 3389, 5432, 5900, 5985, 5986, 6379, 9200, 11211, 27017]

# Порты, которые разрешено публиковать через DNAT для любого источника.
public_dnat_allowed_ports: [80, 443]

# Обозначения «любой адрес». Содержимое IP-групп тоже учитывается.
any_address_tokens: ["*", "0.0.0.0/0", "0.0.0.0-255.255.255.255", "::/0"]

# --- Network Security Groups ---

# Источники во входящих Allow-правилах NSG, которые означают доступ из Интернета.
# Порты, закрытые Deny-правилом с более высоким приоритетом, не считаются открытыми.
nsg_public_sources: ["*", "0.0.0.0/0", "::/0", "Internet"]

# Порты, которые NSG может открывать для Интернета без отклонения
# (sensitive_ports и max_port_range действуют и для NSG).
nsg_public_allowed_ports: [80, 443]

# Отмечать NSG, не привязанные ни к подсети, ни к сетевому интерфейсу.
require_nsg_association: true

# Произвольные требования к свойствам ресурсов: путь в JSON ресурса -> значение.
# Пути смотрите в снимке (azfw_audit.py collect). Списки сравниваются без учёта порядка.
expected_properties:
  firewall:
    # properties.sku.tier: "Premium"
    # location: "westeurope"
  firewall_policy:
    # properties.dnsSettings.enableProxy: true
    # properties.sql.allowSqlRedirect: false
  network_security_group:
    # location: "westeurope"
    # tags.owner: "netops"

# Согласованные исключения. Отклонение, подходящее под исключение, переносится
# в раздел «Исключения» отчёта. check и object — шаблоны с * и ?, без учёта регистра;
# object — путь из столбца «Объект» отчёта. reason обязателен, expires — необязателен:
# после этой даты исключение перестаёт действовать.
exceptions:
  # - check: AZFW-SENSITIVE-PORT
  #   object: "rg-hub-network/fwpol-hub-prod/rcg-workloads/dnat-published/rdp-jumphost"
  #   reason: "Временный доступ подрядчика, CHG-1050"
  #   expires: 2026-11-30
  # - check: AZFW-CLASSIC
  #   object: "rg-dmz/*"
  #   reason: "Миграция на Firewall Policy запланирована на I квартал"
  # - check: NSG-PUBLIC-PORT
  #   object: "rg-app/nsg-snet-web/allow-https-in"
  #   reason: "Порт 8443 портала согласован, CHG-1061"
