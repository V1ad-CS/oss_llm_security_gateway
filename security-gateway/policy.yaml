# Категории, которые приводят к BLOCK.
# Категория вне списка не блокирует, но остаётся в ответе /v1/scan/* и в журнале.
block_categories:
  - PII
  - SECRET
  - TRADE_SECRET
  - PROMPT_INJECTION
  - UNSAFE_ACTION           # shell, SQL, XSS, SSRF, массовое удаление, повышение прав
  - UNBOUNDED_CONSUMPTION   # «повторяй бесконечно», слишком длинное сообщение
  - MALWARE
  - UNSUPPORTED_FILE
  - SECURITY_SERVICE_UNAVAILABLE

# Правила из LiteLLM guardrail (детекторы RULE:<тип>).
# Типы из этого списка не блокируют запрос, а только фиксируются — аналог
# FLAG_ONLY_TYPES в guardrail. Например, если пользователи — разработчики:
#   flag_only_types: [DANGEROUS_SQL, DANGEROUS_SHELL_EXECUTION, SSRF_INTERNAL_RESOURCE]
flag_only_types: []

# Предельная длина последнего сообщения пользователя, символов (0 — без ограничения).
max_user_message_chars: 30000

# ФИО само по себе часто даёт false positive.
# Включите true, если ваша политика запрещает отправлять любое ФИО.
block_person_names: false

pii_score_threshold: 0.80

# Явные грифы/метки документа (сравнение без учёта регистра).
blocked_markings:
  - "Коммерческая тайна"
  - "Конфиденциально"
  - "Строго конфиденциально"
  - "Для служебного пользования"
  - "Internal Only"
  - "Confidential"
  - "Strictly Confidential"
  - "Commercial Secret"

# ВАЖНО: заполните своими внутренними названиями проектов/клиентов/систем.
protected_terms:
  - "PROJECT-AURORA"
  - "RND-147"
  - "PHOENIX-INTERNAL"

# Семантика коммерческой тайны в MVP делается правилами.
# Если встречаются минимум N разных терминов — BLOCK.
commercial_terms_min_hits: 2
commercial_terms:
  - "маржинальность"
  - "себестоимость"
  - "финансовый прогноз"
  - "неопубликованные цены"
  - "клиентская база"
  - "условия договора"
  - "условия контракта"
  - "ценовая политика"
  - "ценообразование"
  - "коммерческое предложение"
  - "исходный код"
  - "внутренняя архитектура"
  - "план релиза"
  - "слияние"
  - "поглощение"
  - "margin"
  - "cost price"
  - "financial forecast"
  - "unpublished pricing"
  - "customer database"
  - "contract terms"
  - "source code"
  - "internal architecture"
  - "roadmap"
  - "m&a"
